apiVersion: v1
kind: Service
metadata:
  name: dil-connector-mediamtx
  namespace: dil-connector
  labels:
    app.kubernetes.io/name: mediamtx
    app.kubernetes.io/part-of: dil-connector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - name: api
      port: 9997
      targetPort: api
      protocol: TCP
    - name: player
      port: 8080
      targetPort: player
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: dil-connector-mediamtx-rtsp
  namespace: dil-connector
  labels:
    app.kubernetes.io/name: mediamtx
    app.kubernetes.io/part-of: dil-connector
spec:
  # RTSP is a raw TCP protocol and cannot be served through the shared
  # HTTP/HTTPS Gateway. Expose the relay through a stable NodePort instead.
  type: NodePort
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - name: rtsp
      port: 8554
      nodePort: 30554
      targetPort: rtsp
      protocol: TCP
