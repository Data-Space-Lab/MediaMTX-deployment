apiVersion: v1
kind: ConfigMap
metadata:
  name: dil-connector-mediamtx-player
  namespace: dil-connector
  labels:
    app.kubernetes.io/name: mediamtx
    app.kubernetes.io/part-of: dil-connector
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /player {
          return 302 /player/;
        }

        location /player/ {
          rewrite ^/player/(.*)$ /$1 break;
          try_files $uri /index.html;
        }

        # Keep MediaMTX HLS on the same HTTP origin as the player. The
        # MediaMTX API and RTSP TCP service remain private/separate.
        location /hls/ {
          rewrite ^/hls/(.*)$ /$1 break;
          proxy_pass http://127.0.0.1:8888;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_read_timeout 120s;
          proxy_send_timeout 120s;
          proxy_cache off;
          add_header Cache-Control no-cache always;
          add_header Access-Control-Allow-Origin * always;
        }
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>DIL stream player</title>
      <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
      <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #111827; color: #f9fafb; }
        h1 { font-size: 1.25rem; }
        form { display: flex; gap: .5rem; margin-bottom: 1rem; }
        input { flex: 1; min-width: 0; padding: .65rem; background: #1f2937; color: inherit; border: 1px solid #4b5563; border-radius: 4px; }
        button { padding: .65rem 1rem; cursor: pointer; }
        video { width: 100%; max-height: 70vh; background: #000; }
        #status { min-height: 1.5rem; color: #d1d5db; }
        code { color: #93c5fd; }
      </style>
    </head>
    <body>
      <h1>DIL stream player</h1>
      <form id="stream-form">
        <input id="path" name="path" placeholder="MediaMTX stream path" autocomplete="off">
        <button type="submit">Play</button>
      </form>
      <p id="status">Enter a transfer session path or open this page with <code>?path=...</code>.</p>
      <video id="video" controls autoplay muted playsinline></video>
      <script>
        const form = document.getElementById('stream-form');
        const pathInput = document.getElementById('path');
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        let hls;
        let activePath = '';
        let recoveryTimer;
        let lastPlayingAt = 0;

        function clearRecovery() {
          if (recoveryTimer) {
            clearTimeout(recoveryTimer);
            recoveryTimer = undefined;
          }
        }

        function recoverPlayback(reason) {
          if (!activePath || recoveryTimer || document.hidden) return;
          recoveryTimer = setTimeout(() => {
            recoveryTimer = undefined;
            status.textContent = `Reconnecting after ${reason}...`;
            play(activePath, true);
          }, 2500);
        }

        function play(path, recovering = false) {
          path = String(path || '').trim().replace(/^\/+|\/+$/g, '');
          if (!path) {
            status.textContent = 'A stream path is required.';
            return;
          }
          activePath = path;
          clearRecovery();
          pathInput.value = path;
          // Ask MediaMTX to validate the HLS session without its redirect.
          // This keeps all follow-up requests under the public /hls/ prefix.
          const source = `${location.origin}/hls/${encodeURIComponent(path)}/index.m3u8?cookieCheck=1`;
          if (hls) { hls.destroy(); hls = undefined; }
          video.removeAttribute('src');
          status.textContent = recovering ? `Reconnecting ${path}...` : `Loading ${path}...`;

          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = source;
            video.play().catch(() => {});
            status.textContent = recovering ? 'Stream reconnected.' : 'Stream loaded.';
          } else if (window.Hls && Hls.isSupported()) {
            hls = new Hls({
              lowLatencyMode: false,
              liveSyncDurationCount: 3,
              liveMaxLatencyDurationCount: 8,
              maxLiveSyncPlaybackRate: 1.2,
              backBufferLength: 30,
              maxBufferLength: 30,
              maxBufferSize: 60 * 1000 * 1000,
              manifestLoadingMaxRetry: 6,
              levelLoadingMaxRetry: 6,
              fragLoadingMaxRetry: 6,
            });
            hls.loadSource(source);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              status.textContent = 'Stream loaded.';
              video.play().catch(() => {});
            });
            hls.on(Hls.Events.ERROR, (_, data) => {
              if (!data.fatal) return;
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                status.textContent = 'Network interruption; retrying...';
                hls.startLoad();
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                status.textContent = 'Media decoder recovery...';
                hls.recoverMediaError();
              } else {
                status.textContent = `Playback error: ${data.details || 'stream unavailable'}`;
                recoverPlayback('playback error');
              }
            });
          } else {
            status.textContent = 'This browser does not support HLS playback.';
          }
        }

        video.addEventListener('playing', () => {
          lastPlayingAt = Date.now();
          clearRecovery();
          status.textContent = 'Stream playing.';
        });
        video.addEventListener('timeupdate', () => {
          lastPlayingAt = Date.now();
        });
        video.addEventListener('stalled', () => {
          if (Date.now() - lastPlayingAt > 3000) recoverPlayback('buffer stall');
        });
        video.addEventListener('waiting', () => {
          if (Date.now() - lastPlayingAt > 3000) recoverPlayback('buffer underrun');
        });
        video.addEventListener('error', () => recoverPlayback('video error'));

        form.addEventListener('submit', event => {
          event.preventDefault();
          play(pathInput.value);
        });
        const initial = new URLSearchParams(location.search).get('path');
        if (initial) play(initial);
      </script>
    </body>
    </html>
