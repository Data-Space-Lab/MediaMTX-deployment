apiVersion: v1
kind: ConfigMap
metadata:
  name: dil-connector-mediamtx-config
  namespace: dil-connector
  labels:
    app.kubernetes.io/name: mediamtx
    app.kubernetes.io/part-of: dil-connector
data:
  mediamtx.yml: |
    logLevel: info
    # The API is reachable only through the private ClusterIP service. The
    # DIL dataplane calls it without forwarding consumer credentials.
    authMethod: internal
    authInternalUsers:
      - user: any
        pass:
        ips: []
        permissions:
          - action: api
          - action: read
          # The dataplane FFmpeg relay publishes the normalized H.264 stream
          # to a short-lived dynamic path over the private ClusterIP.
          - action: publish
    api: yes
    apiAddress: 0.0.0.0:9997
    rtsp: yes
    rtspAddress: 0.0.0.0:8554
    rtspTransports: [tcp]
    hls: yes
    hlsAddress: 0.0.0.0:8888
    # MPEG-TS avoids the fMP4 timestamp path that rejects this source's
    # slightly non-monotonic H.265 DTS values.
    hlsVariant: mpegts
    # Do not continuously create HLS muxers for the raw provider path. Raw
    # sources can be H.265 and are normalized by the dataplane into the
    # dynamically published -h264 path before browser playback.
    hlsAlwaysRemux: no
    hlsSegmentCount: 7
    hlsSegmentDuration: 1s
    hlsPartDuration: 200ms
    hlsMuxerCloseAfter: 5m
    # The dataplane publishes one short-lived H.264 relay path per transfer.
    # Allow those publisher-created paths in addition to paths created through
    # the MediaMTX API.
    paths:
      all_others: {}
